name: Build and Test

on:
  push:
    branches:
      - main
      - testing
      - anindya
      - 'feature/**'
  pull_request:
    branches:
      - main
      - testing
      - anindya

jobs:
  flutter-check:
    name: Flutter Analyze & Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build Windows Desktop Release
        run: flutter build windows --release

  backend-check:
    name: Python Backend Syntax & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install pytest flake8 fastapi uvicorn websockets qrcode mss yt-dlp opencv-python-headless supervision pyyaml numpy

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Run Backend Tests
        run: |
          cd backend/app
          pytest tests/test_risk_engine.py tests/test_security.py tests/test_motion_gate.py -v
        continue-on-error: true
